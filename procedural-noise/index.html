    if (normalizeDisplay && !haveLockedNormalizeRange)
    {
      const normalizeCpuTimer = beginCpuPass();
      const normalizeGpuTimer = beginGpuTimingPass('normalize');
      gl.bindFramebuffer(gl.FRAMEBUFFER, normalizeSourceFramebuffer);
      const normalizeReductionPassCount = renderNormalizeReduction(res);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, res, res);
      gl.useProgram(copyProgram);
      gl.bindVertexArray(fullscreenVAO);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, normalizeSourceTexture);
      gl.uniform1i(copyUniforms.source, 0);
      gl.uniform1i(copyUniforms.normalData, 0);
      applyDisplayLevels(copyUniforms, true, 0.0, 1.0, true);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      endGpuTimingPass(normalizeGpuTimer);
      endCpuPass('normalize', normalizeCpuTimer, normalizeReductionPassCount + 1);
    }

    if (state.cubeView) {
      const animated = animationActive();
      const cubeNormalDue = cubeNormalNeedsUpdate
        || (animated && (timeMs - cubeLastNormalUpdateTime) >= CUBE_NORMAL_UPDATE_INTERVAL_MS);
      if (cubeNormalDue) {
        if (state.normals)
        {
          // Upload while preview WebGL drawing buffer is still valid.

          cubeTextureUsesPreview = true;
          cubeTextureDirty = false;
          queueCubeTextureFromPreview();
        }
        else
        {
          cubeTextureUsesPreview = false;
          if (cubeNormalReadbackSync)
          {
            cubeNormalReadbackQueuedAgain = true;
          }
          else
          {
            updateCubeNormalMap(res, baseCells, phases, elapsedSeconds, activeProgram, activeUniforms);
          }
        }
        cubeNormalNeedsUpdate = false;
        cubeLastNormalUpdateTime = timeMs;
      }
    }

    endGpuTimingFrame();
    if (state.showStats)
    {
      performanceMetrics.lastFrameDrawCount = currentFrameDrawCount;
      performanceMetrics.cpuMs = smoothMetric(performanceMetrics.cpuMs, performance.now() - cpuStartTime);
      startGpuFenceProbe(timeMs);
      updatePerformanceStats(timeMs);
    }
  }

  function queueRedrawWithInvalidation(
    invalidateVelocityMap,
    invalidateFlowMap,
    invalidateFieldMap,
    invalidateNormalizeRange = true,
    invalidateCubeNormal = true
  ) {
    if (invalidateCubeNormal) cubeNormalNeedsUpdate = true;
    if (invalidateVelocityMap) velocityMapDirty = true;
    if (invalidateFlowMap) flowMapDirty = true;
    if (invalidateFieldMap) fieldMapDirty = true;
    if (invalidateNormalizeRange) normalizeRangeDirty = true;
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(drawNoise);
  }

  function queueRedraw() {
    queueRedrawWithInvalidation(true, true, true, true);
  }

  function queueDisplayRedraw(invalidateNormalizeRange = false, invalidateCubeNormal = true) {
    queueRedrawWithInvalidation(false, false, false, invalidateNormalizeRange, invalidateCubeNormal);
  }

  function queueVelocityRedraw() {
    queueRedrawWithInvalidation(true, true, false, true);
  }

  function queueFlowRedraw() {
    queueRedrawWithInvalidation(false, true, false, true);
  }

  function queueFieldRedraw() {
    queueRedrawWithInvalidation(false, false, true, true);
  }

  function playbackTimeAffectsSpatialField()
  {
    return state.animation.some(value => Math.abs(value) > 1e-9);
  }

  function playbackTimeAffectsCurlFlow()
  {
    return state.curl && (state.curlScale != 0.0) && (Math.abs(state.curlAnimation) > 1e-9);
  }

  function queuePlaybackTimeRedraw()
  {
    if (playbackTimeAffectsSpatialField())
    {
      queueRedraw();
      return;
    }

    if (playbackTimeAffectsCurlFlow())
      queueFlowRedraw();
  }

  let seamlessSwitchVersion = 0;

  async function setSeamless(v) {
    const nextSeamless = !!v;
    if (nextSeamless === state.seamless) return;

    const previousSeamless = state.seamless;
    const switchVersion = ++seamlessSwitchVersion;
    const useFieldCache = shouldUseFieldCache();
    seamlessToggle.disabled = true;

    try
    {
      const requiredPrograms = [
        warmNoiseProgramVariant(state.curlNormalsMode, nextSeamless, useFieldCache)
      ];

      if (state.curl)
      {
        if (state.compareExact)
          requiredPrograms.push(warmExactFlowProgram(nextSeamless));
        else
        {
          requiredPrograms.push(warmFlowProgram());
          requiredPrograms.push(warmVelocityProgram(nextSeamless));
        }

        if (useFieldCache)
          requiredPrograms.push(warmFieldCacheProgram(state.curlNormalsMode, nextSeamless));
      }

      await Promise.all(requiredPrograms);
      if (switchVersion !== seamlessSwitchVersion)
        return;

      rebuildNoiseProgram(state.curlNormalsMode, nextSeamless, useFieldCache);
      state.seamless = nextSeamless;
      seamlessToggle.checked = state.seamless;
      autoTileButton.disabled = !state.seamless;
      queueRedraw();
    }
    catch (err)
    {
      if (switchVersion !== seamlessSwitchVersion)
        return;

      state.seamless = previousSeamless;
      seamlessToggle.checked = previousSeamless;
      autoTileButton.disabled = !previousSeamless;
      console.error('Failed to prepare Seamless shader variant', err);
    }
    finally
    {
      if (switchVersion === seamlessSwitchVersion)
        seamlessToggle.disabled = false;
    }
  }

  function autoTileSeamless() {
    if (!state.seamless) return;

    const baseCells = 256 / Math.max(1e-6, state.scale);

    let repeatMultiple = 1;
    if (state.curl) {
      const scaleHundredths = Math.max(1, Math.round(Math.abs(state.curlFreqScale) * 100));
      const gcd = (a, b) => {
        a = Math.abs(a) | 0;
        b = Math.abs(b) | 0;
        while (b) {
          const t = a % b;
          a = b;
          b = t;
        }
        return Math.max(a, 1);
      };
      const denom = 100;
      const g = gcd(scaleHundredths, denom);
      repeatMultiple = Math.max(1, Math.floor(denom / g));
    }

    for (let axis = 0; axis < 2; ++axis) {
      const effective = state.tiling[axis] * baseCells;
      let repeats = Math.round(effective / repeatMultiple) * repeatMultiple;
      if (repeats === 0) repeats = effective < 0 ? -repeatMultiple : repeatMultiple;
      state.tiling[axis] = repeats / baseCells;
    }

    updateUi();
    queueRedraw();
  }
  function setNormals(v) {
    state.normals = !!v;
    normalsToggle.checked = state.normals;
    if (state.curl && !state.compareExact)
      queueVelocityRedraw();
    else
      queueDisplayRedraw(true);
  }
  let curlSwitchVersion = 0;

  function prepareCurlPipelineForEnable()
  {
    const spatialAnimationActive = state.animation.some(value => Math.abs(value) > 1e-9);
    const useFieldCache = (Math.abs(state.curlAnimation) > 1e-9) && !spatialAnimationActive;
    const requiredPrograms = [
      warmNoiseProgramVariant(state.curlNormalsMode, state.seamless, useFieldCache)
    ];

    if (state.compareExact)
      requiredPrograms.push(warmExactFlowProgram(state.seamless));
    else
    {
      requiredPrograms.push(warmFlowProgram());
      requiredPrograms.push(warmVelocityProgram(state.seamless));
    }

    if (useFieldCache)
      requiredPrograms.push(warmFieldCacheProgram(state.curlNormalsMode, state.seamless));

    return Promise.all(requiredPrograms);
  }

  async function setCurl(v) {
    const nextCurl = !!v;
    const switchVersion = ++curlSwitchVersion;

    if (!nextCurl)
    {
      state.curl = false;
      curlToggle.checked = false;
      queueDisplayRedraw(true);
      return;
    }

    // Never let drawNoise fall through to synchronous first-use compilation.
    curlToggle.checked = state.curl;
    curlToggle.disabled = true;

    try
    {
      await prepareCurlPipelineForEnable();
      if (switchVersion !== curlSwitchVersion)
        return;

      state.curl = true;
      curlToggle.checked = true;
      queueDisplayRedraw(true);
    }
    catch (err)
    {
      if (switchVersion !== curlSwitchVersion)
        return;

      state.curl = false;
      curlToggle.checked = false;
      console.error('Failed to prepare Curl pipeline', err);
    }
    finally
    {
      if (switchVersion === curlSwitchVersion)
        curlToggle.disabled = false;
    }
  }
  async function setCurlNormalsMode(v) {
    const nextMode = clamp(Math.round(Number(v) || 0), 0, 2);
    if (nextMode === state.curlNormalsMode)
      return;

    state.curlNormalsMode = nextMode;
    curlNormalsModeSelect.value = String(nextMode);
    if (state.curl && (state.normals || state.cubeView))
      queueDisplayRedraw();
  }
  function setCurlSeedOffset(v) {
    state.curlSeedOffset = clamp(Math.round(Number(v) || 0), -4, 4);
    curlSeedOffsetValue.textContent = String(state.curlSeedOffset);
    curlSeedOffsetSlider.value = String(state.curlSeedOffset);
    if (state.curl)
      queueVelocityRedraw();
    else
    {
      velocityMapDirty = true;
      flowMapDirty = true;
    }
  }
  function setCubeView(v) {
    state.cubeView = !!v;
    cubeViewToggle.checked = state.cubeView;
    cubePreviewFloat.classList.toggle('hidden', !state.cubeView);
    if (state.cubeView) queueDisplayRedraw();
  }
  function setNormalize(v) {
    state.normalize = !!v;
    normalizeToggle.checked = state.normalize;
    if (!state.normals)
      queueDisplayRedraw(true, false);
  }
  function setBilinear(v) {
    state.bilinear = !!v;
    bilinearToggle.checked = state.bilinear;
    applyBilinearState();

    if (state.curl && !state.compareExact && (state.curlScale != 0.0))
      queueFlowRedraw();
    else
      queueDisplayRedraw(true);
  }
  function setShowStats(v) {
    state.showStats = !!v;
    showStatsToggle.checked = state.showStats;
    performanceStatsPanel.classList.toggle('hidden', !state.showStats);

    if (state.showStats)
    {
      const timeNow = performance.now();
      statsNoiseFrameCount = 0;
      statsRafFrameCount = 0;
      statsNoiseFrameWindowStart = timeNow;
      statsRafFrameWindowStart = timeNow;
      statsLastUiUpdateTime = -Infinity;
      updatePerformanceStats(timeNow, true);
      queueDisplayRedraw(false, false);
    }
    else
    {
      clearPerformanceTimingState();
    }
  }
  let exactReferenceSwitchVersion = 0;

  async function setCompareExact(v) {
    const nextExactReference = !!v;
    const switchVersion = ++exactReferenceSwitchVersion;

    if (!nextExactReference)
    {
      if (!state.curl)
      {
        state.compareExact = false;
        compareExactToggle.checked = false;
        return;
      }

      compareExactToggle.checked = state.compareExact;
      compareExactToggle.disabled = true;
      try
      {
        await Promise.all([
          warmFlowProgram(),
          warmVelocityProgram(state.seamless)
        ]);
        if (switchVersion !== exactReferenceSwitchVersion)
          return;

        state.compareExact = false;
        compareExactToggle.checked = false;
        queueFlowRedraw();
      }
      catch (err)
      {
        if (switchVersion !== exactReferenceSwitchVersion)
          return;

        state.compareExact = true;
        compareExactToggle.checked = true;
        console.error('Failed to prepare Optimized Curl pipeline', err);
      }
      finally
      {
        if (switchVersion === exactReferenceSwitchVersion)
          compareExactToggle.disabled = false;
      }
      return;
    }

    if (!state.curl)
    {
      state.compareExact = true;
      compareExactToggle.checked = true;
      return;
    }

    compareExactToggle.checked = state.compareExact;
    compareExactToggle.disabled = true;

    try
    {
      await warmExactFlowProgram(state.seamless);
      if (switchVersion !== exactReferenceSwitchVersion)
        return;

      state.compareExact = true;
      compareExactToggle.checked = true;
      queueFlowRedraw();
    }
    catch (err)
    {
      if (switchVersion !== exactReferenceSwitchVersion)
        return;

      state.compareExact = false;
      compareExactToggle.checked = false;
      console.error('Failed to prepare Exact Curl pipeline', err);
    }
    finally
    {
      if (switchVersion === exactReferenceSwitchVersion)
        compareExactToggle.disabled = false;
    }
  }
  function setCurlScale(v) {
    state.curlScale = clamp(Number(v) || 0, 0, 4);
    updateUi();
    if (state.curl)
      queueRedraw();
    else
    {
      velocityMapDirty = true;
      flowMapDirty = true;
      fieldMapDirty = true;
    }
  }
  function setCurlFreqScale(v) {
    state.curlFreqScale = clamp(Number(v) || 1, 0.1, 4);
    updateUi();
    if (state.curl)
      queueVelocityRedraw();
    else
    {
      velocityMapDirty = true;
      flowMapDirty = true;
    }
  }
  function setCurlOctaves(v) {
    state.curlOctaves = clamp(Math.round(Number(v) || 1), 1, 8);
    updateUi();
    if (state.curl)
      queueVelocityRedraw();
    else
    {
      velocityMapDirty = true;
      flowMapDirty = true;
    }
  }
  function setCurlAnimation(v) {
    state.curlAnimation = clamp(Number(v) || 0, -1, 1);
    updateUi();
    if (state.curl)
      queueFlowRedraw();
    else
      flowMapDirty = true;
  }
  function setAdvectionSteps(v) {
    state.advectionSteps = clamp(Math.round(Number(v) || 1), 1, 16);
    updateUi();
    if (state.curl)
      queueFlowRedraw();
    else
      flowMapDirty = true;
  }
  function setSeed(v) {
    state.seed = clamp(Math.trunc(Number(v) || 0), 0, 2147483647);
    updateUi(); queueRedraw();
  }
  function setScale(v) {
    state.scale = clamp(Number(v) || 1, 4, 512);
    updateUi(); queueRedraw();
  }
  function setOctaves(v) {
    state.octaves = clamp(Math.round(Number(v) || 1), 1, 8);
    updateUi(); queueFieldRedraw();
  }
  function setLacunarity(v) {
    state.lacunarity = clamp(Number(v) || 1, 1, 4);
    updateUi(); queueRedraw();
  }
  function setPersistence(v) {
    state.persistence = clamp(Number(v) || 0, 0, 1);
    updateUi(); queueRedraw();
  }
  function setContrast(v) {
    state.contrast = clamp(Number(v) || 0.1, 0.1, 4);
    updateUi(); queueDisplayRedraw(true);
  }
  let blurSwitchVersion = 0;

  async function setBlurRadius(v) {
    const nextBlurRadius = clamp(Number(v) || 0, 0, 0.2);
    const switchVersion = ++blurSwitchVersion;
    if (nextBlurRadius > 0.0)
    {
      try
      {
        await warmBlurProgram();
        if (switchVersion !== blurSwitchVersion)
          return;
      }
      catch (err)
      {
        console.error('Failed to prepare Blur shader', err);
        return;
      }
    }

    state.blurRadius = nextBlurRadius;
    updateUi();
    queueDisplayRedraw(true);
  }
  function setBlurQuality(v) {
    state.blurQuality = clamp(Math.round(Number(v) || 1), 1, 16);
    updateUi();
    if (state.blurRadius > 0.0)
      queueDisplayRedraw(true);
  }
  function setResolution(v) {
    state.resolution = clamp(Math.round(Number(v) || 256), 64, 512);
    updateUi(); queueRedraw();
  }

  function setVectorComponent(group, index, value) {
    let v = parseEditingNumber(value);
    if (v === null) return false;
    if (group === 'tiling') v = clamp(v, -256, 256);
    else v = clamp(v, -1000, 1000);
    state[group][index] = v;
    queueRedraw();
    return true;
  }

  function commitVectorInput(group, index, input) {
    const parsed = parseEditingNumber(input.value);
    if (parsed === null) {
      input.value = formatVectorValue(state[group][index]);
      return;
    }
    setVectorComponent(group, index, parsed);
    input.value = formatVectorValue(state[group][index]);
  }

  function animationActive() {
    if (!state.playbackPlaying || (state.playbackSpeed <= 1e-9))
      return false;

    return playbackTimeAffectsSpatialField() || playbackTimeAffectsCurlFlow();

  function togglePlayback() {
    state.playbackPlaying = !state.playbackPlaying;
    playbackLastUpdateTime = performance.now();

  function stopPlayback() {

    state.playbackTime = 0.0;
    playbackLastUpdateTime = performance.now();

  function setPlaybackTime(value) {
    const nextTime = clamp(Number(value) || 0.0, 0.0, 60.0);
    state.playbackTime = nextTime;
    playbackLastUpdateTime = performance.now();
    playbackSlider.value = String(state.playbackTime);
    playbackValue.textContent = `${state.playbackTime.toFixed(2)} / 60.00`;

  function setPlaybackSpeed(value) {
    const timeNow = performance.now();
    const previousTime = state.playbackTime;

    updatePlaybackTime(timeNow);

    state.playbackSpeed = clamp(Number(value) || 0.0, 0.0, 2.0);
    playbackSpeedSlider.value = String(state.playbackSpeed);
    playbackSpeedValue.textContent = state.playbackSpeed.toFixed(2);

    const playbackTimeChanged = Math.abs(state.playbackTime - previousTime) > 1e-9;
    if (playbackTimeChanged || (state.playbackPlaying && (state.playbackSpeed > 1e-9)))
      queuePlaybackTimeRedraw();
  }

  function buildPreviewFilename() {
    const parts = ['noisefbm'];

    parts.push('seed' + String(state.seed));
    parts.push('res' + String(state.resolution));
    parts.push('scale' + String(state.scale));

    if (state.seamless) parts.push('seam');
    if (state.normals) parts.push('norm');
    if (state.curl) parts.push(state.compareExact ? 'exactcurl' : 'curl');
    if (state.curl && (state.curlNormalsMode === 1)) parts.push('screenderiv');
    if (state.curl && (state.curlNormalsMode === 2)) parts.push('fulljac');
    if (state.normalize) parts.push('normlz');
    if (state.blurRadius > 0.0) parts.push('blur' + state.blurRadius.toFixed(3));

    return parts.join('_') + '.png';
  }

  function showEmbeddedSaveFallback(imageUrl, filename) {

  async function savePreviewImage() {
    const filename = buildPreviewFilename();
    const chatGptSandbox = window.location.hostname === 'web-sandbox.oaiusercontent.com';
    const restrictedPreview = chatGptSandbox || (window.self !== window.top);

    // Use native save picker when available outside restricted previews.

    if (!restrictedPreview && (typeof window.showSaveFilePicker === 'function')) {
      try {
        const fileHandle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{
            description: 'PNG Image',
            accept: { 'image/png': ['.png'] }
          }]
        });

        const blob = await new Promise((resolve, reject) => {
          previewCanvas.toBlob(result => {
            if (result)
              resolve(result);
            else
              reject(new Error('Could not encode preview PNG.'));
          }, 'image/png');
        });

        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }
      catch (err) {
        if (err && err.name === 'AbortError')
          return;

        console.warn('Native save picker unavailable; using browser fallback.', err);
      }
    }

    const imageUrl = previewCanvas.toDataURL('image/png');

    if (restrictedPreview) {
      showEmbeddedSaveFallback(imageUrl, filename);
      return;
    }

    const anchor = document.createElement('a');
    anchor.href = imageUrl;
    anchor.download = filename;
    anchor.style.display = 'none';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
  }

  blurQualitySlider.addEventListener('input', e => setBlurQuality(e.target.value));
  resolutionSlider.addEventListener('input', e => setResolution(e.target.value));
  playPauseButton.addEventListener('click', togglePlayback);
  stopButton.addEventListener('click', stopPlayback);
  playbackSlider.addEventListener('input', e => setPlaybackTime(e.target.value));
  playbackSpeedSlider.addEventListener('input', e => setPlaybackSpeed(e.target.value));
  for (const [group, inputs] of Object.entries(vectorInputs)) {
    inputs.forEach((input, index) => {
      input.addEventListener('input', e => setVectorComponent(group, index, e.target.value));
      input.addEventListener('blur', () => commitVectorInput(group, index, input));
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          commitVectorInput(group, index, input);
          input.blur();
        }
      });
    });
  }

  applyBilinearState();
  updateUi();
  if (state.showStats)
    updatePerformanceStats(performance.now(), true);
  drawNoise();
  renderCube();
  warmPerformancePipeline();

  window.__noiseApp = {
    getState: () => ({ ...state }),
    getGpuInfo: () => gpuRenderer,
    getPerformanceStats: () => ({
      ...performanceMetrics,
      gpuPasses: { ...performanceMetrics.gpuPasses },
      cpuPasses: { ...performanceMetrics.cpuPasses },
      gpuFenceMs: performanceMetrics.gpuFenceMs,
      cubeCpuMs: performanceMetrics.cubeCpuMs,
      drawCount: performanceMetrics.lastFrameDrawCount,
      gpuTimerAvailable: !!gpuTimerExtension,
      cubeGpuTimerAvailable: !!cubeGpuTimerExtension,
      parallelShaderCompileAvailable: !!parallelShaderCompileExtension,
      textureMemoryBytes: approximateTextureMemoryBytes(),
      velocityMap: [velocityMapWidth, velocityMapHeight],
      flowMap: [flowMapWidth, flowMapHeight],
      exactFlowState: [exactFlowStateWidth, exactFlowStateHeight],
      fieldMap: [fieldMapWidth, fieldMapHeight],
      curlPreparing: curlToggle.disabled,
      exactReferencePreparing: compareExactToggle.disabled,
      warmups: {
        noise: noiseProgramWarmups.size,
        exact: exactFlowProgramWarmups.size,
        velocity: velocityProgramWarmups.size,
        field: fieldCacheProgramWarmups.size,
        flow: flowProgramWarmup ? 1 : 0,
        blur: blurProgramWarmup ? 1 : 0
      }
    }),
    setSeamless,
    autoTileSeamless,
    setNormals,
    setCurl,
    setCurlNormalsMode,
    setCurlSeedOffset,
    setCubeView,
    setNormalize,
    setBilinear,
    setShowStats,
    setCompareExact,
    setCurlScale,
    setCurlFreqScale,
    setCurlOctaves,
    setCurlAnimation,
    setAdvectionSteps,
    setSeed,
    setScale,
    setOctaves,
    setLacunarity,
    setPersistence,
    setContrast,
    setBlurRadius,
    setBlurQuality,
    setResolution,
    togglePlayback,
    stopPlayback,
    setPlaybackTime,
    setPlaybackSpeed,
    setVectorComponent,
    savePreviewImage,
    redraw: drawNoise
  };
})().catch(err => {
  console.error(err);
  const shell = document.querySelector('.canvas-shell');
  if (shell) {
    const errorBox = document.createElement('pre');
    errorBox.style.margin = '8px';
    errorBox.style.padding = '10px';
    errorBox.style.whiteSpace = 'pre-wrap';
    errorBox.style.wordBreak = 'break-word';
    errorBox.style.color = '#ff8f8f';
    errorBox.style.background = '#120d10';
    errorBox.style.border = '1px solid rgba(255,120,120,.35)';
    errorBox.style.borderRadius = '7px';
    errorBox.style.fontSize = '11px';
    errorBox.textContent = 'Render error\n' + (err && (err.stack || err.message) ? (err.stack || err.message) : String(err));
    shell.appendChild(errorBox);
  }
});
</script>
</body>
</html>
