<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title>X post</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#191919;color:#eee;font:15px/1.4 Arial,sans-serif;scrollbar-width:none}::-webkit-scrollbar{display:none}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}article{max-width:900px;margin:0 auto;padding:16px;background:#000;border:1px solid #303438;border-radius:14px}header{display:flex;align-items:center;gap:9px;margin-bottom:6px;min-width:0}.avatar{width:40px;height:40px;border-radius:50%;flex:none}.identity{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;min-width:0}.name{font-weight:700}.handle,time{color:#71767b}.verified{color:#fff;background:#1d9bf0;border-radius:50%;font-size:10px;width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center}.body{margin-left:0}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.clamped{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,6);overflow:hidden}.text a,.more,.source{color:#1d9bf0}.more{border:0;background:none;padding:3px 0 8px}.media{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border:1px solid #303438;border-radius:14px;margin:8px 0 0}.quote{display:block;margin-top:6px;border:1px solid #303438;border-radius:14px;padding:10px 12px}.quote:hover{background:#080808;text-decoration:none}.quote header{margin-bottom:7px}.quote .avatar{width:23px;height:23px}.quote .identity{font-size:14px}.quote-content{display:flex;gap:12px;align-items:flex-start}.thumbnail{position:relative;width:94px;height:94px;flex:none;overflow:hidden;border:1px solid #303438;border-radius:12px}.thumbnail img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;bottom:4px;left:5px;font-size:12px;background:#000b;padding:0 3px;border-radius:3px}.quote .text{font-size:14px;--lines:4;flex:1;min-width:0}.footer{display:flex;justify-content:space-between;align-items:center;color:#71767b;font-size:13px;margin-top:12px;gap:12px}.footer a{display:flex;align-items:center;gap:6px}.footer svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}.likes:hover{color:#f91880}.source{font-size:12px}.error{padding:16px;color:#ffb8b8}button:focus-visible,a:focus-visible{outline:2px solid #1d9bf0;outline-offset:3px}@media(max-width:480px){article{padding:12px}.body{margin-left:0}.identity{font-size:14px}.thumbnail{width:80px;height:80px}.quote .handle{display:none}}
</style>
<style>
.editor{max-width:900px;margin:0 auto 14px;padding:16px;border:1px solid #38424b;border-radius:14px;background:#20262c}.editor label{font-weight:bold}.editor-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}.editor input[type=range]{flex:1;min-width:140px;accent-color:#1d9bf0}.editor input[type=number]{width:64px}.editor input,.editor button{font:inherit;padding:8px;border:1px solid #52606d;border-radius:7px;background:#111;color:#eee}.editor button{background:#1d9bf0;color:#fff;border:0}.editor .embed-link{width:100%;font-size:12px}.editor p{margin:8px 0 0;color:#aab5bf;font-size:13px}
</style>
</head>
<body><main id="root" aria-live="polite">Loading post…</main>
<script>
const root = document.getElementById('root');
const parameters = new URLSearchParams(location.search);
const postId = parameters.get('id');
const lineCount = Number(parameters.get('lines') || 5);
function fitTextToEmbed(text, more){
    if(parameters.get('fit') !== '1'){return;}
    const article = root.querySelector('article');
    let framePending = false;
    function fit(){
        framePending = false;
        if(more.getAttribute('aria-expanded') === 'true'){return;}
        more.hidden = false;
        const lineHeight = Number.parseFloat(getComputedStyle(text).lineHeight);
        const reservedHeight = article.getBoundingClientRect().height - text.getBoundingClientRect().height;
        const availableHeight = document.documentElement.clientHeight - reservedHeight - 2;
        const count = Math.max(1, Math.min(30, Math.floor(availableHeight / lineHeight)));
        text.style.setProperty('--lines', count);
        more.hidden = text.scrollHeight <= text.clientHeight + 1;
    }
    function scheduleFit(){
        if(framePending){return;}
        framePending = true;
        requestAnimationFrame(fit);
    }
    window.addEventListener('resize', scheduleFit);
    more.addEventListener('click', scheduleFit);
    new ResizeObserver(scheduleFit).observe(article);
    scheduleFit();
}
function addEditor(text, more){
    if(parameters.get('edit') !== '1'){return;}
    const panel = element('section','editor');
    panel.setAttribute('aria-label','Embed settings');
    const label = element('label','','Text lines before Show more');
    label.htmlFor = 'line-count';
    const controls = element('div','editor-controls');
    const slider = element('input');
    slider.type = 'range';
    slider.min = '1';
    slider.max = '30';
    slider.value = lineCount;
    slider.setAttribute('aria-label','Text lines before Show more');
    const number = element('input');
    number.type = 'number';
    number.id = 'line-count';
    number.min = '1';
    number.max = '30';
    number.value = lineCount;
    const copy = element('button','','Copy embed link');
    const output = element('input','embed-link');
    output.readOnly = true;
    output.setAttribute('aria-label','Embed link without editing controls');
    const status = element('p','','Adjust the preview, then paste the copied link into Notion. The copied link hides these controls.');
    status.setAttribute('role','status');
    function update(value){
        const count = Number(value);
        if(!Number.isInteger(count) || count < 1 || count > 30){number.reportValidity();return;}
        slider.value = count;
        number.value = count;
        text.style.setProperty('--lines',count);
        text.classList.add('clamped');
        more.setAttribute('aria-expanded','false');
        more.textContent = 'Show more';
        more.hidden = text.scrollHeight <= text.clientHeight + 1;
        const url = new URL(location.href);
        url.searchParams.set('lines',count);
        history.replaceState(null,'',url);
        url.searchParams.delete('edit');
        output.value = url.href;
        copy.textContent = 'Copy embed link';
    }
    slider.oninput = () => update(slider.value);
    number.oninput = () => {if(number.value !== ''){update(number.value);}};
    copy.onclick = async () => {
        try{
            await navigator.clipboard.writeText(output.value);
            copy.textContent = 'Copied';
            status.textContent = 'Paste this link into your Notion embed. Readers will see only the post.';
        }catch(error){
            output.focus();
            output.select();
            status.textContent = 'Clipboard access was blocked. Copy the selected link with Ctrl+C.';
        }
    };
    controls.append(slider,number,copy);
    panel.append(label,controls,output,status);
    root.before(panel);
    update(lineCount);
}
const element = (tag, className, text) => {const node = document.createElement(tag);if(className){node.className=className;}if(text!==undefined){node.textContent=text;}return node;};
const postUrl = post => 'https://x.com/' + post.user.screen_name + '/status/' + post.id_str;
function link(url, className, text){const node=element('a',className,text);node.href=url;node.target='_blank';node.rel='noopener noreferrer';return node;}
function header(post){const row=element('header');const avatar=element('img','avatar');avatar.src=post.user.profile_image_url_https;avatar.alt='';row.append(avatar);const identity=element('div','identity');identity.append(link('https://x.com/'+post.user.screen_name,'name',post.user.name));if(post.user.is_blue_verified||post.user.verified){const badge=element('span','verified','✓');badge.setAttribute('aria-label','Verified on X');identity.append(badge);}identity.append(element('span','handle','@'+post.user.screen_name+' ·'));const date=element('time','',new Date(post.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}));date.dateTime=post.created_at;identity.append(date);row.append(identity);return row;}
function cleanText(post){let text=post.full_text || post.text;for(const media of post.entities?.media||[]){text=text.replace(media.url,'');}if(post.quoted_tweet){for(const url of post.entities?.urls||[]){if(url.expanded_url?.includes('/status/'+post.quoted_tweet.id_str)){text=text.replace(url.url,'');}}}return text.trim();}
function textBlock(post, interactive=true){const paragraph=element('p','text clamped');const text=cleanText(post);const matches=interactive?text.matchAll(/https:\/\/t\.co\/\w+|#[\p{L}\p{N}_]+|@[A-Za-z0-9_]+/gu):[];let index=0;for(const match of matches){paragraph.append(document.createTextNode(text.slice(index,match.index)));const word=match[0];let url;if(word[0]==='#'){url='https://x.com/hashtag/'+encodeURIComponent(word.slice(1));}else if(word[0]==='@'){url='https://x.com/'+word.slice(1);}else{url=(post.entities?.urls||[]).find(item=>item.url===word)?.expanded_url||word;}paragraph.append(link(url,'',word));index=match.index+word.length;}paragraph.append(document.createTextNode(text.slice(index)));return paragraph;}
function mainMedia(post){const media=post.mediaDetails?.[0];if(!media){return null;}if(media.type==='video'||media.type==='animated_gif'){const variants=media.video_info.variants.filter(item=>item.content_type==='video/mp4').sort((a,b)=>b.bitrate-a.bitrate);if(!variants.length){throw new Error('No playable MP4 supplied by X.');}const video=element('iframe','media');video.src='https://platform.twitter.com/embed/Tweet.html?id='+post.id_str+'&theme=dark&maxWidth=900';video.title='Video from '+post.user.name+' on X';video.scrolling='no';video.allow='fullscreen';video.allowFullscreen=true;return video;}const image=element('img','media');image.src=media.media_url_https;image.alt=media.ext_alt_text||'Post image';return image;}
function quote(post){const card=link(postUrl(post),'quote');card.setAttribute('aria-label','Open quoted post on X');card.append(header(post));for(const nested of card.querySelectorAll('a')){nested.replaceWith(element('span',nested.className,nested.textContent));}const content=element('div','quote-content');const media=post.mediaDetails?.[0];if(media){const thumbnail=element('div','thumbnail');const image=element('img');image.src=media.media_url_https;image.alt='Quoted post media';thumbnail.append(image);if(media.video_info?.duration_millis){const seconds=Math.floor(media.video_info.duration_millis/1000);thumbnail.append(element('span','duration',Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')));}content.append(thumbnail);}content.append(textBlock(post,false));card.append(content);return card;}
const icons={reply:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5H4l2-4A8.5 8.5 0 1 1 20 11.5Z"/>',heart:'<path d="M12 21 3.5 12.5C-2 6 6-1 12 6c6-7 14 0 8.5 6.5Z"/>',external:'<path d="M14 3h7v7M21 3 10 14M10 5H4v16h16v-6"/>'};
function action(url,label,type){const anchor=link(url,type,label);const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');icon.innerHTML=icons[type==='likes'?'heart':type];anchor.prepend(icon);return anchor;}
async function render(){if(!/^\d+$/.test(postId||'')){throw new Error('A numeric post id is required.');}if(!Number.isInteger(lineCount)||lineCount<1||lineCount>30){throw new Error('lines must be between 1 and 30.');}const response=await fetch('./posts/'+postId+'.json?v=2', {cache:'no-cache'});if(!response.ok){throw new Error('This post has not been imported ('+response.status+').');}const post=await response.json();const article=element('article');article.append(header(post));const body=element('div','body');const text=textBlock(post);text.style.setProperty('--lines',lineCount);body.append(text);const more=element('button','more','Show more');more.setAttribute('aria-expanded','false');more.onclick=()=>{const expanded=more.getAttribute('aria-expanded')!=='true';more.setAttribute('aria-expanded',String(expanded));text.classList.toggle('clamped',!expanded);more.textContent=expanded?'Show less':'Show more';};body.append(more);if(post.note_tweet && !post.full_text){const full=link(postUrl(post),'source',' · Full post on X');body.append(full);}const media=mainMedia(post);if(media){body.append(media);}if(post.quoted_tweet){body.append(quote(post.quoted_tweet));}const footer=element('div','footer');footer.append(action('https://x.com/intent/tweet?in_reply_to='+post.id_str,String(post.conversation_count??post.reply_count??'Reply'),'reply'),action('https://x.com/intent/like?tweet_id='+post.id_str,String(post.favorite_count??'Like'),'likes'),action(postUrl(post),'View on X','external'));body.append(footer);article.append(body);root.replaceChildren(article);requestAnimationFrame(()=>{more.hidden=text.scrollHeight<=text.clientHeight+1;});new ResizeObserver(()=>{if(more.getAttribute('aria-expanded')==='false'){more.hidden=text.scrollHeight<=text.clientHeight+1;}}).observe(text);}
render().then(()=>{
    const text = root.querySelector('.body > .text');
    const more = root.querySelector('.more');
    if(parameters.get('fit') === '1'){
        fitTextToEmbed(text, more);
    }else{
        addEditor(text, more);
    }
}).catch(error=>{root.className='error';root.textContent=error.message;});
</script>
</body></html>
