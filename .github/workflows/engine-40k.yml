name: Engine 40K proof
on:
  push:
    branches: [engine-40k-20261010]
    paths: ['engine-40k/**', '.github/workflows/engine-40k.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-40k-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin build SDK
        run: echo '{"sdk":{"version":"10.0.401","rollForward":"disable"}}' > global.json
      - name: Install browser build tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build actual .NET, Roslyn and graphics bundle
        id: build
        run: python3 engine-40k/build_runtime.py
      - name: Package one offline HTML file
        id: package
        run: python3 engine-40k/package_single.py
      - name: Install test browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prove real C# compilation and execution in the browser
        if: always() && steps.build.outcome == 'success'
        run: python3 engine-40k/smoke_runtime.py
      - name: Test phone editor controls
        if: always() && steps.build.outcome == 'success'
        run: python3 engine-40k/test_editor.py
      - name: Test standalone file offline and stuck-script recovery
        if: always() && steps.package.outcome == 'success'
        run: python3 engine-40k/test_single.py
      - name: Collect source, evidence and static website
        if: always()
        run: |
          mkdir -p engine-40k-artifact
          cp -a engine-40k/runtime-dist engine-40k-artifact/ 2>/dev/null || true
          cp engine-40k/*.html engine-40k/*.js engine-40k/*.css engine-40k/*.json engine-40k/*.md engine-40k/*.py engine-40k/*.png engine-40k-artifact/ 2>/dev/null || true
          cp -a engine-40k/runtime engine-40k-artifact/source-runtime 2>/dev/null || true
          cp global.json engine-40k-artifact/
          rm -rf engine-40k-artifact/source-runtime/bin engine-40k-artifact/source-runtime/obj
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-40k-proof
          path: engine-40k-artifact/
          retention-days: 14
